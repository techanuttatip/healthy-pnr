    <link rel="manifest" href="/manifest-inspector.webmanifest" />
    <script>
      (function() {
        try {
          var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
          var search = window.location.search;
          var pathname = window.location.pathname.toLowerCase();
          var isInspector = search.indexOf('inspector') !== -1 || 
                            search.indexOf('mobile') !== -1 || 
                            search.indexOf('pwa') !== -1 ||
                            pathname.indexOf('/inspector') !== -1 ||
                            pathname.indexOf('/mobile') !== -1 ||
                            pathname.indexOf('/pwa') !== -1;

          if (isInspector) {
            localStorage.setItem('pwa_launch_mode', 'inspector');
          } else if (isStandalone || (window.innerWidth <= 820 && localStorage.getItem('pwa_launch_mode') === 'inspector')) {
            if (pathname === '/' || pathname === '') {
              window.location.replace('/?app=inspector');
            }
          }
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="ระบบบริการอิเล็กทรอนิกส์ด้านการอนุญาต/การแจ้ง (e-Service) ตาม พ.ร.บ. การสาธารณสุข พ.ศ. ๒๕๓๕ องค์การบริหารส่วนตำบลโป่งน้ำร้อน อำเภอฝาง จังหวัดเชียงใหม่" />
    <title>ระบบบริการ e-Service งานทะเบียนใบอนุญาต (พ.ร.บ. สาธารณสุข ๓๕) — อบต.โป่งน้ำร้อน</title>
